spring.application.name=appointment-service
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/appointments}
spring.datasource.username=${DATABASE_USER:appointments}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=5000
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
appointments.duration=30m
appointments.booking-requests-per-second=${BOOKING_REQUESTS_PER_SECOND:10}
appointments.opening-time=08:00
appointments.closing-time=20:00
admin.username=${ADMIN_USERNAME}
admin.password-hash=${ADMIN_PASSWORD_HASH}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful

integrations.enabled=true
integrations.poll-delay=1s
integrations.jobs-per-poll=10
integrations.maximum-attempts=5
integrations.initial-retry-delay=5s
integrations.maximum-retry-delay=15m
integrations.request-timeout=5s
integrations.calendar-url=${CALENDAR_URL:http://localhost:8091}
integrations.room-url=${ROOM_URL:http://localhost:8092}
integrations.calendar-token=${CALENDAR_TOKEN:}
integrations.room-token=${ROOM_TOKEN:}
integrations.email-from=${EMAIL_FROM:appointments@example.invalid}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
logging.structured.format.console=ecs


management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
# Prometheus collects metrics; Jaeger only receives traces.
management.otlp.metrics.export.enabled=false

# Document only the public application contract, not actuator/framework endpoints.
springdoc.packages-to-scan=pt.healthcare.appointments.booking.api
springdoc.override-with-generic-response=false
