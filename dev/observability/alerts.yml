groups:
  - name: appointments
    rules:
      - alert: IntegrationFailed
        expr: integration_jobs_failed > 0
        labels: {severity: critical}
        annotations:
          summary: 'Post-booking jobs failed; inspect the job table and application logs'
      - alert: IntegrationBacklog
        expr: integration_oldest_pending_seconds > 300
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'Post-booking work has been pending for more than five minutes'
      - alert: AppointmentServiceUnavailable
        expr: up{job="appointments"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: 'The application or its metrics endpoint is unavailable'
