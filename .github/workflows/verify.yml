name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: sh scripts/check-dependencies.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan
          path: target/dependency-scan/
          retention-days: 7
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw --batch-mode verify
      - run: python3 scripts/load/run.py --smoke --output /tmp/healthcare-smoke
